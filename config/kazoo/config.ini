; Kazoo configuration for the lab.
; Derived from 2600hz kazoo-configs-core 4.3 core/config.ini
; (EnkiMultimedia/kazoo-configs-core cbcc916d), with lab hosts and ports.

[amqp]
uri = "amqp://guest:guest@rabbitmq.kazoo.lab:5672"

[zone]
name = lab
amqp_uri = "amqp://guest:guest@rabbitmq.kazoo.lab:5672"

[bigcouch]
compact_automatically = true
cookie = kazoo_lab_cookie
ip = "couchdb.kazoo.lab"
port = 5984
; CouchDB 3 has no separate node-local port
admin_port = 5984
; OpenCore strips quotes only for some keys, so credentials stay unquoted
username = admin
password = admin

[kazoo_apps]
cookie = kazoo_lab_cookie
zone = lab

[ecallmgr]
cookie = kazoo_lab_cookie
zone = lab

[log]
syslog = none
console = info
file = error
; OpenCore reads the file log level from "error"
error = error
